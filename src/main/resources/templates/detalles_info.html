<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${Titulo}">Pagina Spring Boot</title>
</head>
<body>

    <p><strong>Desarrollador (@Value):</strong> <span th:text="${UsuarioConfig}"></span></p>
    <p><strong>Proyecto (@Value):</strong> <span th:text="${ProyectoConfig}"></span></p>
       <h1>Información de empleado</h1>
    <ul>
        <li><strong>Nombre:</strong> <span th:text="${Empleado.nombre}"></span></li>
        <li><strong>Apellido:</strong> <span th:text="${Empleado.apellido}"></span></li>
        <li>
            <strong>Dirección:</strong> 
            <span th:text="${Empleado.direccion != null ? Empleado.direccion : 'No tiene direccion' }" ></span>
        </li>
        <li><strong>Puesto:</strong> <span th:text="${Empleado.puesto}"></span></li>
        <li><strong>Edad:</strong> <span th:text="${Empleado.edad}"></span></li>
        <li><strong>Teléfono:</strong> <span th:text="${Empleado.telefono}"></span></li>
        <li><strong>ID:</strong> <span th:text="${Empleado.id}"></span></li>
    </ul>

    <h1>Lista de Empleados</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Dirección</th>
                <th>Puesto</th>
                <th>Edad</th>
                <th>Teléfono</th>
                <th>Departamento</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="Empleado : ${Empleados}">
                <td th:text="${Empleado.nombre}"></td>
                <td th:text="${Empleado.apellido}"></td>
                <td th:text="${Empleado.direccion}"></td>
                <td th:text="${Empleado.puesto}"></td>
                <td th:text="${Empleado.edad}"></td>
                <td th:text="${Empleado.telefono}"></td>
                <td th:text="${Empleado.id}"></td>
            </tr>
        </tbody>
    </table>


    <h2>Registrar Nuevo Empleado</h2>
<form th:action="@{/nuevo-empleado}" method="post">
    <div><label>Nombre: <input type="text" name="nombre" required /></label></div>
    <div><label>Apellido: <input type="text" name="apellido" required /></label></div>
    <div><label>Dirección: <input type="text" name="direccion" /></label></div>
    <div><label>Puesto: <input type="text" name="puesto" required /></label></div>
    <div><label>Edad: <input type="number" name="edad" required /></label></div>
    <div><label>Teléfono: <input type="number" name="telefono" value="0" required /></label></div>
    <div><label>ID / Depto: <input type="number" name="id" value="1" required /></label></div>
    <br>
    <button type="submit">Guardar Empleado</button>
</form>
    
</body>
</html>
